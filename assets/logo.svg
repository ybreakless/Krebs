<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Krebs</title>
  <desc id="d">A minimal orange crab, the Rust mascot: a wide oval body, two eyes on stalks and short legs.</desc>

  <rect width="512" height="512" rx="112" fill="#000"/>

  <!-- Legs -->
  <g fill="none" stroke="#F4501E" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="110,300 70,320 62,356"/>
    <polyline points="128,338 94,366 90,398"/>
    <polyline points="164,366 142,396 142,424"/>
    <polyline points="402,300 442,320 450,356"/>
    <polyline points="384,338 418,366 422,398"/>
    <polyline points="348,366 370,396 370,424"/>
  </g>

  <!-- Eye stalks -->
  <g stroke="#F4501E" stroke-width="16" stroke-linecap="round">
    <line x1="222" y1="222" x2="214" y2="160"/>
    <line x1="290" y1="222" x2="298" y2="160"/>
  </g>
  <circle cx="212" cy="136" r="30" fill="#fff"/>
  <circle cx="300" cy="136" r="30" fill="#fff"/>
  <circle cx="212" cy="140" r="11" fill="#1a0a05"/>
  <circle cx="300" cy="140" r="11" fill="#1a0a05"/>

  <!-- Body -->
