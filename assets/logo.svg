<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Krebs Studio — minimalist geometric crab with stylus nib</title>
  <desc>Nordic cyan facets on an obsidian container; a fountain pen nib at the carapace center standing for writing and whiteboarding.</desc>
  <defs>
    <radialGradient id="obsidianGlow" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#131a29"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </radialGradient>
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="facetMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="facetDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075985" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="facetPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#062b45"/>
    </linearGradient>
    <linearGradient id="limb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="claw" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Obsidian container with hairline cyan inset ring -->
  <rect width="512" height="512" rx="112" fill="url(#obsidianGlow)"/>
  <rect x="14" y="14" width="484" height="484" rx="96" fill="none"
        stroke="#38bdf8" stroke-opacity="0.16" stroke-width="2"/>
  <rect x="24" y="24" width="464" height="464" rx="86" fill="none"
        stroke="#0284c7" stroke-opacity="0.10" stroke-width="1.4"/>

  <!-- Walking legs (three per side, thin geometric strokes behind the shell) -->
  <g fill="none" stroke="url(#limb)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M162 244 L100 214 L70 226"/>
    <path d="M158 286 L88 292 L58 330"/>
    <path d="M170 328 L112 360 L96 406"/>
    <path d="M350 244 L412 214 L442 226"/>
    <path d="M354 286 L424 292 L454 330"/>
    <path d="M342 328 L400 360 L416 406"/>
  </g>

  <!-- Arms ending in open geometric pincers (three-stroke claw, line-art style) -->
  <g fill="none" stroke="url(#limb)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M196 216 Q166 152 148 126"/>
    <path d="M148 126 L120 88"/>
    <path d="M148 126 L168 84"/>
    <path d="M316 216 Q346 152 364 126"/>
    <path d="M364 126 L392 88"/>
    <path d="M364 126 L344 84"/>
  </g>

  <!-- Faceted carapace: symmetric fan around the center axis -->
  <g>
    <polygon points="256,180 150,262 256,250" fill="url(#facetTop)"/>
    <polygon points="256,180 362,262 256,250" fill="url(#facetTop)"/>
    <polygon points="150,262 256,250 256,316" fill="url(#facetMid)"/>
    <polygon points="362,262 256,250 256,316" fill="url(#facetMid)"/>
    <polygon points="150,262 196,344 256,316" fill="url(#facetDeep)"/>
    <polygon points="362,262 316,344 256,316" fill="url(#facetDeep)"/>
    <polygon points="196,344 256,316 316,344 256,352" fill="url(#facetPlate)"/>
    <!-- Crisp outer contour -->
    <path d="M256 180 L150 262 L196 344 L256 352 L316 344 L362 262 Z"
          fill="none" stroke="#7dd3fc" stroke-opacity="0.45" stroke-width="2.5"
          stroke-linejoin="round"/>
  </g>

  <!-- Eyes seated on the shell apex line -->
  <circle cx="224" cy="186" r="9.5" fill="#f8fafc"/>
  <circle cx="224" cy="188" r="4.2" fill="#0f172a"/>
  <circle cx="220" cy="180" r="1.5" fill="#38bdf8"/>
  <circle cx="288" cy="186" r="9.5" fill="#f8fafc"/>
  <circle cx="288" cy="188" r="4.2" fill="#0f172a"/>
  <circle cx="284" cy="180" r="1.5" fill="#38bdf8"/>

  <!-- Fountain pen nib: the writing + whiteboard provenance mark -->
  <g>
    <circle cx="256" cy="292" r="38" fill="#0b0f19" fill-opacity="0.55"
            stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.6"/>
    <path d="M256 254 C 272 254 276 262 272 276 L 260 328 C 258 334 254 334 252 328 L 240 276 C 236 262 240 254 256 254 Z"
          fill="#f8fafc"/>
    <line x1="256" y1="258" x2="256" y2="318" stroke="#0b0f19" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="256" cy="308" r="3.4" fill="#0b0f19"/>
  </g>
</svg>
