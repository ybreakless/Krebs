name: Release Build & Multi-Platform Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. Linux Packaging (APT .deb, DNF .rpm, Pacman .pkg.tar.zst)
  # -------------------------------------------------------------
  build-linux:
    name: Linux Packages (APT, DNF, Pacman, Tarball)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            rpm \
            zstd \
            squashfs-tools \
            zip

      - name: Install Packaging Tools (cargo-binstall, cargo-deb, cargo-generate-rpm)
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cargo-deb cargo-generate-rpm

      - name: Build Release Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Determine Version
        id: ver
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Package for Debian / Ubuntu (APT .deb)
        run: |
          cargo deb --target x86_64-unknown-linux-gnu --no-build
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/debian/*.deb dist/

      - name: Package for Fedora / RHEL (DNF .rpm)
        run: |
          cargo generate-rpm --target x86_64-unknown-linux-gnu
          cp target/generate-rpm/*.rpm dist/

      - name: Package for Arch Linux (Pacman .pkg.tar.zst)
        run: |
          VERSION="${{ steps.ver.outputs.VERSION }}"
          PKG_DIR="pkg-arch"
          mkdir -p "$PKG_DIR/usr/bin"
          mkdir -p "$PKG_DIR/usr/share/applications"
          mkdir -p "$PKG_DIR/usr/share/icons/hicolor/scalable/apps"
          mkdir -p "$PKG_DIR/usr/share/icons/hicolor/512x512/apps"
          mkdir -p "$PKG_DIR/usr/share/licenses/krebs"
          mkdir -p "$PKG_DIR/usr/share/doc/krebs"

          cp target/x86_64-unknown-linux-gnu/release/krebs "$PKG_DIR/usr/bin/krebs"
          chmod 755 "$PKG_DIR/usr/bin/krebs"
          cp packaging/linux/krabbe "$PKG_DIR/usr/bin/krabbe"
          chmod 755 "$PKG_DIR/usr/bin/krabbe"
          cp packaging/linux/krebs.desktop "$PKG_DIR/usr/share/applications/krebs.desktop"
          cp assets/logo.svg "$PKG_DIR/usr/share/icons/hicolor/scalable/apps/krebs.svg"
          cp assets/logo.png "$PKG_DIR/usr/share/icons/hicolor/512x512/apps/krebs.png"
          cp LICENSE "$PKG_DIR/usr/share/licenses/krebs/LICENSE"
          cp README.md "$PKG_DIR/usr/share/doc/krebs/README.md"

          INST_SIZE=$(du -sb "$PKG_DIR" | cut -f1)
          BUILD_DATE=$(date +%s)

          cat << EOF > "$PKG_DIR/.PKGINFO"
          pkgname = krebs
          pkgbase = krebs
          pkgver = ${VERSION}-1
          pkgdesc = Minimalist Writing & Infinite Whiteboard Studio in Pure Rust
          url = https://github.com/ybreakless/Krebs
          builddate = ${BUILD_DATE}
          packager = ybreakless <https://github.com/ybreakless>
          size = ${INST_SIZE}
          arch = x86_64
          license = MIT
          depend = fontconfig
          depend = libx11
          depend = libxcursor
          depend = libxrandr
          depend = libxi
          depend = libxinerama
          depend = libxkbcommon
          depend = mesa
          depend = wayland
          EOF

          # Format file cleanly without leading spaces
          sed -i 's/^[ \t]*//' "$PKG_DIR/.PKGINFO"

          tar -C "$PKG_DIR" -c .PKGINFO usr | zstd -19 -T0 > "dist/krebs-${VERSION}-1-x86_64.pkg.tar.zst"

      - name: Package Standalone Linux Tarball
        run: |
          VERSION="${{ steps.ver.outputs.VERSION }}"
          TAR_DIR="krebs-v${VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "$TAR_DIR"
          cp target/x86_64-unknown-linux-gnu/release/krebs "$TAR_DIR/krebs"
          cp packaging/linux/krabbe "$TAR_DIR/krabbe"
          chmod +x "$TAR_DIR/krabbe"
          cp packaging/linux/krebs.desktop "$TAR_DIR/"
          cp assets/logo.svg "$TAR_DIR/"
          cp assets/logo.png "$TAR_DIR/"
          cp README.md "$TAR_DIR/"
          cp LICENSE "$TAR_DIR/"
          tar -czvf "dist/krebs-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz" "$TAR_DIR"

      - name: Build Linux AppImage
        run: |
          VERSION="${{ steps.ver.outputs.VERSION }}"
          APPDIR="AppDir"
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/512x512/apps"

          cp target/x86_64-unknown-linux-gnu/release/krebs "$APPDIR/usr/bin/krebs"
          cp packaging/linux/krabbe "$APPDIR/usr/bin/krabbe"
          chmod +x "$APPDIR/usr/bin/krabbe"
          cp packaging/linux/krebs.desktop "$APPDIR/usr/share/applications/krebs.desktop"
          cp assets/logo.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/krebs.png"
          mkdir -p "$APPDIR/usr/share/licenses"
          cp LICENSE "$APPDIR/usr/share/licenses/krebs.txt"

          curl -L --proto '=https' --tlsv1.2 -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          # VERSION is consumed by linuxdeploy to name the produced AppImage.
          export VERSION="$VERSION"
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir "$APPDIR" \
            --desktop-file "$APPDIR/usr/share/applications/krebs.desktop" \
            --icon-file "$APPDIR/usr/share/icons/hicolor/512x512/apps/krebs.png" \
            --output appimage

          OUTPUT_NAME=$(find . -maxdepth 1 -name '*.AppImage' ! -name 'linuxdeploy*' | head -n1)
          mv "$OUTPUT_NAME" "dist/krebs-v${VERSION}-x86_64.AppImage"

      - name: Pin Flatpak Manifest to Release Tag
        run: |
          VERSION="${{ steps.ver.outputs.VERSION }}"
          TAG="v${VERSION}"
          # On a tag push the tag exists on the remote: pin the manifest to it
          # so the bundle is reproducible. For workflow_dispatch runs before the
          # tag exists remotely, fall back to the default branch (main).
          if git ls-remote --tags --exit-code origin "refs/tags/${TAG}"; then
            sed "s/branch: main/tag: ${TAG}/" \
              packaging/linux/flatpak/org.ybreakless.krebs.yml > flatpak-manifest.yml
          else
            cp packaging/linux/flatpak/org.ybreakless.krebs.yml flatpak-manifest.yml
          fi
          cat flatpak-manifest.yml

      - name: Install Flatpak Tooling
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.repo

      - name: Build Flatpak Bundle
        run: |
          VERSION="${{ steps.ver.outputs.VERSION }}"
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --default-branch=stable --repo=flatpak-repo \
            --state-dir=.flatpak-builder-state build/flatpak flatpak-manifest.yml
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.repo \
            flatpak-repo "dist/krebs-v${VERSION}-linux.flatpak" org.ybreakless.krebs stable

      - name: Package Flatpak Manifest & Metadata
        run: |
          mkdir -p dist
          cp packaging/linux/flatpak/org.ybreakless.krebs.yml dist/
          cp packaging/linux/flatpak/org.ybreakless.krebs.metainfo.xml dist/
          cp packaging/linux/flatpak/org.ybreakless.krebs.desktop dist/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

  # -------------------------------------------------------------
  # 2. Windows Packaging (ARM64, x86 32-bit, x64 64-bit)
  # -------------------------------------------------------------
  build-windows:
    name: Windows Packages (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - i686-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Determine Version
        id: ver
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Package Windows Zip Archive
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.VERSION }}"
          $target = "${{ matrix.target }}"
          $pkgDir = "krebs-v$ver-$target"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          Copy-Item "target\$target\release\krebs.exe" "$pkgDir\Krebs.exe" -Force
          Copy-Item "krebs_icon.ico" "$pkgDir\Krebs.ico" -Force
          Copy-Item "assets\logo.svg" "$pkgDir\logo.svg" -Force
          Copy-Item "assets\logo.png" "$pkgDir\logo.png" -Force
          Copy-Item "install.ps1" "$pkgDir\install.ps1" -Force
          Copy-Item "krabbe.cmd" "$pkgDir\krabbe.cmd" -Force
          Copy-Item "krabbe" "$pkgDir\krabbe" -Force
          Copy-Item "README.md" "$pkgDir\README.md" -Force
          Copy-Item "LICENSE" "$pkgDir\LICENSE" -Force

          Compress-Archive -Path "$pkgDir\*" -DestinationPath "dist\krebs-v$ver-$target.zip" -Force

      - name: Build Windows Installer (Inno Setup, x64)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.VERSION }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          & $iscc "/DAppVersion=$ver" "packaging\windows\installer.iss"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: dist/*

  # -------------------------------------------------------------
  # 3. macOS Packaging (Intel, Apple Silicon, Universal .app & .dmg)
  # -------------------------------------------------------------
  build-macos:
    name: macOS Packages (Intel, Apple Silicon, Universal DMG)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build Apple Silicon (aarch64-apple-darwin)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build Intel (x86_64-apple-darwin)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Determine Version
        id: ver
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Individual Tarballs
        run: |
          VERSION="${{ steps.ver.outputs.VERSION }}"
          mkdir -p dist

          # Intel tarball
          INTEL_DIR="krebs-v${VERSION}-x86_64-apple-darwin"
          mkdir -p "$INTEL_DIR"
          cp target/x86_64-apple-darwin/release/krebs "$INTEL_DIR/krebs"
          cp README.md "$INTEL_DIR/"
          cp LICENSE "$INTEL_DIR/"
          tar -czvf "dist/krebs-v${VERSION}-x86_64-apple-darwin.tar.gz" "$INTEL_DIR"

          # Apple Silicon tarball
          ARM_DIR="krebs-v${VERSION}-aarch64-apple-darwin"
          mkdir -p "$ARM_DIR"
          cp target/aarch64-apple-darwin/release/krebs "$ARM_DIR/krebs"
          cp README.md "$ARM_DIR/"
          cp LICENSE "$ARM_DIR/"
          tar -czvf "dist/krebs-v${VERSION}-aarch64-apple-darwin.tar.gz" "$ARM_DIR"

      - name: Create Universal macOS App Bundle & DMG
        run: |
          VERSION="${{ steps.ver.outputs.VERSION }}"

          # Combine binaries using lipo
          lipo -create \
            -output krebs_universal \
            target/x86_64-apple-darwin/release/krebs \
            target/aarch64-apple-darwin/release/krebs

          # Generate krebs.icns from logo.png using macOS iconutil
          mkdir -p krebs.iconset
          sips -z 16 16     assets/logo.png --out krebs.iconset/icon_16x16.png
          sips -z 32 32     assets/logo.png --out krebs.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/logo.png --out krebs.iconset/icon_32x32.png
          sips -z 64 64     assets/logo.png --out krebs.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/logo.png --out krebs.iconset/icon_128x128.png
          sips -z 256 256   assets/logo.png --out krebs.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/logo.png --out krebs.iconset/icon_256x256.png
          sips -z 512 512   assets/logo.png --out krebs.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/logo.png --out krebs.iconset/icon_512x512.png
          iconutil -c icns krebs.iconset -o krebs.icns

          # Assemble App Bundle
          APP_NAME="Krebs.app"
          mkdir -p "$APP_NAME/Contents/MacOS"
          mkdir -p "$APP_NAME/Contents/Resources"
          cp packaging/macos/Info.plist "$APP_NAME/Contents/Info.plist"
          echo -n "APPL????" > "$APP_NAME/Contents/PkgInfo"
          cp krebs_universal "$APP_NAME/Contents/MacOS/krebs"
          chmod 755 "$APP_NAME/Contents/MacOS/krebs"
          cp krebs.icns "$APP_NAME/Contents/Resources/krebs.icns"

          # Zip universal app
          zip -r -y "dist/krebs-v${VERSION}-macos-universal.zip" "$APP_NAME"

          # Create DMG
          DMG_TMP="dmg_folder"
          mkdir -p "$DMG_TMP"
          cp -R "$APP_NAME" "$DMG_TMP/"
          ln -s /Applications "$DMG_TMP/Applications"
          hdiutil create -volname "Krebs" -srcfolder "$DMG_TMP" -ov -format UDZO "dist/krebs-v${VERSION}-macos-universal.dmg"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist/*

  # -------------------------------------------------------------
  # 3b. AUR (Arch User Repository): version-bump PKGBUILDs, verify
  #     checksums against the built tarball, optionally publish to
  #     aur.archlinux.org when the AUR_SSH_PRIVATE_KEY secret is set.
  # -------------------------------------------------------------
  build-aur:
    name: AUR Packages (krebs, krebs-bin)
    runs-on: ubuntu-latest
    needs: build-linux
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: linux-artifacts

      - name: Determine Version & Checksum
        id: aur
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

          TARBALL="linux-artifacts/krebs-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          test -f "$TARBALL" || { ls -la linux-artifacts; exit 1; }
          SHA=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          echo "SHA=$SHA" >> $GITHUB_OUTPUT

      - name: Prepare AUR Working Trees
        run: |
          VERSION="${{ steps.aur.outputs.VERSION }}"
          SHA="${{ steps.aur.outputs.SHA }}"

          # --- krebs (builds from the versioned tarball) ---------------------
          mkdir -p aur
          cp packaging/linux/PKGBUILD aur/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" aur/PKGBUILD
          cat > aur/.SRCINFO <<EOF
          pkgbase = krebs
          pkgname = krebs
          pkgver = ${VERSION}
          pkgrel = 1
          pkgdesc = Minimalist Writing & Infinite Whiteboard Studio in Pure Rust
          url = https://github.com/ybreakless/Krebs
          arch = x86_64
          license = MIT
          depends = fontconfig
          depends = libx11
          depends = libxcursor
          depends = libxrandr
          depends = libxi
          depends = libxinerama
          depends = libxkbcommon
          depends = mesa
          depends = wayland
          makedepends = cargo
          makedepends = rust
          source = krebs-${VERSION}.tar.gz::https://github.com/ybreakless/Krebs/archive/refs/tags/v${VERSION}.tar.gz
          sha256sums = SKIP
          EOF

          # --- krebs-bin (installs the prebuilt release tarball) -------------
          mkdir -p aur-bin
          cp packaging/linux/PKGBUILD.bin-aur-template aur-bin/PKGBUILD
          cp packaging/linux/.SRCINFO.bin-aur-template aur-bin/.SRCINFO
          sed -i "s/^pkgver=.*$/pkgver=${VERSION}/" aur-bin/PKGBUILD
          sed -i -E \
            -e "s/krebs-v1\.0\.0-x86_64\.tar\.gz/krebs-v${VERSION}-x86_64.tar.gz/" \
            -e "s/krebs-v1\.0\.0-x86_64-unknown-linux-gnu\.tar\.gz/krebs-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz/" \
            aur-bin/PKGBUILD
          sed -i \
            -e "s/^pkgver = .*/pkgver = ${VERSION}/" \
            -e "s/^sha256sums = .*/sha256sums = ${SHA}/" \
            -e "s/krebs-v1\.0\.0-x86_64\.tar\.gz/krebs-v${VERSION}-x86_64.tar.gz/" \
            -e "s/krebs-v1\.0\.0-x86_64-unknown-linux-gnu\.tar\.gz/krebs-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz/" \
            aur-bin/.SRCINFO
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA}')/" aur-bin/PKGBUILD

          echo "----- aur/PKGBUILD -----";     grep -E "^(pkgver|source|sha256)" aur/PKGBUILD
          echo "----- aur-bin/PKGBUILD -----"; grep -E "^(pkgver|source|sha256)" aur-bin/PKGBUILD
          echo "----- aur-bin/.SRCINFO -----"; grep -E "^(pkgver|source|sha256)" aur-bin/.SRCINFO

      - name: Publish to AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        continue-on-error: true
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan -H aur.archlinux.org 2>/dev/null >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key -o IdentitiesOnly=yes"

          git config --global user.name "krebs-release-bot"
          git config --global user.email "krebs-release-bot@users.noreply.github.com"

          git clone "ssh://aur@aur.archlinux.org/krebs-bin.git" aurbin-push
          cp aur-bin/PKGBUILD aur-bin/.SRCINFO aurbin-push/
          git -C aurbin-push add .
          git -C aurbin-push diff --cached --quiet || git -C aurbin-push commit -m "Update to v${{ steps.aur.outputs.VERSION }}"
          git -C aurbin-push push

          git clone "ssh://aur@aur.archlinux.org/krebs.git" aurpush
          cp aur/PKGBUILD aur/.SRCINFO aurpush/
          git -C aurpush add .
          git -C aurpush diff --cached --quiet || git -C aurpush commit -m "Update to v${{ steps.aur.outputs.VERSION }}"
          git -C aurpush push

      - name: Upload AUR Package Files
        uses: actions/upload-artifact@v4
        with:
          name: aur-packages
          path: |
            aur/PKGBUILD
            aur/.SRCINFO
            aur-bin/PKGBUILD
            aur-bin/.SRCINFO

  # -------------------------------------------------------------
  # 4. GitHub Release Publisher & Checksums
  # -------------------------------------------------------------
  publish-release:
    name: Publish Multi-Platform Release on GitHub
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.version }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v ]]; then
            TAG="v$TAG"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "Krebs ${{ steps.tag.outputs.TAG }} — Multi-Platform Release"
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## 🦀 Krebs ${{ steps.tag.outputs.TAG }} Multi-Platform Release
            
            Minimalist, distraction-free writing studio & infinite vector whiteboard in **100% pure Rust**.
            
            --- 
            
            ### 📦 Linux Packages
            - **Ubuntu / Debian / Linux Mint (APT):**
              ```bash
              sudo apt install ./krebs_*_amd64.deb
              ```
            - **Fedora / RHEL / CentOS (DNF):**
              ```bash
              sudo dnf install ./krebs-*.x86_64.rpm
              ```
            - **Arch Linux / Manjaro / EndeavourOS (Pacman):**
              ```bash
              sudo pacman -U ./krebs-*-x86_64.pkg.tar.zst
              ```
              or install `krebs` / `krebs-bin` from the **AUR**:
              ```bash
              yay -S krebs-bin
              ```
            - **AppImage (every distribution):**
              ```bash
              chmod +x krebs-v*-x86_64.AppImage
              ./krebs-v*-x86_64.AppImage
              ```
            - **Flatpak (single-file bundle):**
              ```bash
              flatpak install ./krebs-v*-linux.flatpak
              ```
              or build from the shipped manifest:
              ```bash
              flatpak-builder build org.ybreakless.krebs.yml
              ```
            - **Generic Linux Tarball:**
              ```bash
              tar -xzvf krebs-v*-x86_64-unknown-linux-gnu.tar.gz
              ./krebs
              ```
            
            ---
            
            ### 🪟 Windows Packages
            - **Installer (x64, no admin rights):** `krebs-v*-x64-setup.exe` — recommended
            - **Portable x64:** `krebs-v*-x86_64-pc-windows-msvc.zip`
            - **Portable x86 (32-bit):** `krebs-v*-i686-pc-windows-msvc.zip`
