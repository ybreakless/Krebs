[package]
name = "krebs"
version = "0.1.0"
edition = "2021"
authors = ["Krebs Team"]
description = "Krebs - Portable Minimalist Writing Studio"

[[bin]]
name = "krebs"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13.1", features = ["advanced", "tokio", "canvas"] }
unicode-bidi = "0.3"
rfd = "0.15"
arboard = "3.4"
notify = "6.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
pulldown-cmark = "0.12"
chrono = "0.4"
open = "5.4"
image = { version = "0.25", default-features = false, features = ["png"] }
